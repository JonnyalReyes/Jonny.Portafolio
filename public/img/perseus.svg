<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="perBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180509" />
      <stop offset="50%" stop-color="#2a0d15" />
      <stop offset="100%" stop-color="#0a030c" />
    </linearGradient>
    <linearGradient id="perAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="50%" stop-color="#ff6b4a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="perGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="350" fill="url(#perBg)" />

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#ff4757" stroke-width="1">
    <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600" />
    <path d="M50 0 V350 M100 0 V350 M150 0 V350 M200 0 V350 M250 0 V350 M300 0 V350 M350 0 V350 M400 0 V350 M450 0 V350 M500 0 V350 M550 0 V350" />
  </g>

  <!-- Glowing orb -->
  <circle cx="480" cy="140" r="95" fill="#ff3b5c" opacity="0.25" filter="url(#perGlow)" />

  <!-- Radar / Radio waves & Phone element -->
  <g transform="translate(420, 75)">
    <!-- Radar concentric rings -->
    <circle cx="65" cy="85" r="70" fill="none" stroke="#ff3b5c" stroke-width="1.5" opacity="0.2"/>
    <circle cx="65" cy="85" r="50" fill="none" stroke="#ff3b5c" stroke-width="1.5" opacity="0.4"/>
    <circle cx="65" cy="85" r="30" fill="none" stroke="#ff6b4a" stroke-width="2" opacity="0.7"/>

    <!-- Smartphone body -->
    <rect x="25" y="15" width="80" height="140" rx="14" fill="#1b1722" stroke="#ff3b5c" stroke-width="2.5" />
    <!-- Notch / speaker -->
    <rect x="47" y="23" width="36" height="5" rx="2.5" fill="#ff3b5c" opacity="0.7" />
    <!-- Alert card on phone screen -->
    <rect x="33" y="38" width="64" height="24" rx="5" fill="#3a101b" stroke="#ff3b5c" stroke-width="1"/>
    <text x="40" y="53" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ff4d6d">🚨 START ROJO</text>
    <!-- On-device AI chips on screen -->
    <rect x="33" y="70" width="64" height="12" rx="3" fill="#2d1627" />
    <text x="37" y="79" font-family="system-ui, sans-serif" font-size="7" fill="#fcd34d">Llama 3.2 • On-Device</text>
    <rect x="33" y="88" width="64" height="12" rx="3" fill="#2d1627" />
    <text x="37" y="97" font-family="system-ui, sans-serif" font-size="7" fill="#a5b4fc">Whisper ASR • P2P Mesh</text>
    <!-- Offline status pill -->
    <rect x="38" y="112" width="54" height="14" rx="7" fill="#15803d" />
    <text x="44" y="122" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#fff">✈ 100% OFFLINE</text>
  </g>

  <!-- Badge -->
  <rect x="50" y="60" width="225" height="28" rx="14" fill="rgba(255, 59, 92, 0.15)" stroke="rgba(255, 59, 92, 0.4)" stroke-width="1.5" />
  <text x="65" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff4d6d" letter-spacing="1">APP MÓVIL • IA ON-DEVICE</text>

  <!-- Title -->
  <text x="50" y="135" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="url(#perAccent)" letter-spacing="-0.5">Perseus.ai</text>

  <!-- Description snippet -->
  <text x="50" y="175" font-family="system-ui, sans-serif" font-size="16" fill="#fecdd3" font-weight="400">Red P2P móvil de triaje humanitario</text>
  <text x="50" y="200" font-family="system-ui, sans-serif" font-size="16" fill="#fda4af" font-weight="400">y rescate 100% offline con IA en el dispositivo</text>
  <text x="50" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#fb7185" font-weight="500">Decentralized AI Hackathon 2026 • ISD Summit</text>

  <!-- Tags -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e1828" stroke="#4c1d34" />
    <text x="12" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#fed7aa" font-weight="500">React Native</text>

    <rect x="115" y="0" width="90" height="26" rx="6" fill="#1e1828" stroke="#4c1d34" />
    <text x="125" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#fed7aa" font-weight="500">TypeScript</text>

    <rect x="215" y="0" width="85" height="26" rx="6" fill="#1e1828" stroke="#4c1d34" />
    <text x="225" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#fed7aa" font-weight="500">Llama 3.2</text>

    <rect x="310" y="0" width="75" height="26" rx="6" fill="#1e1828" stroke="#4c1d34" />
    <text x="320" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#fed7aa" font-weight="500">P2P Mesh</text>
  </g>
</svg>
