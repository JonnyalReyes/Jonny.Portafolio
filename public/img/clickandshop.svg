<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="csAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="350" fill="url(#csBg)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#fff" stroke-width="1">
    <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600" />
    <path d="M50 0 V350 M100 0 V350 M150 0 V350 M200 0 V350 M250 0 V350 M300 0 V350 M350 0 V350 M400 0 V350 M450 0 V350 M500 0 V350 M550 0 V350" />
  </g>

  <!-- Glowing orb -->
  <circle cx="470" cy="160" r="85" fill="#f59e0b" opacity="0.25" filter="url(#csGlow)" />

  <!-- Graphics: Shopping Cart & DB cylinders -->
  <g transform="translate(400, 90)">
    <!-- Database cylinder -->
    <ellipse cx="60" cy="40" rx="45" ry="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M15 40 v35 c0 9 20 16 45 16 s45 -7 45 -16 v-35" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M15 75 v35 c0 9 20 16 45 16 s45 -7 45 -16 v-35" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

    <!-- Shopping bag / cart accent -->
    <rect x="70" y="90" width="60" height="55" rx="10" fill="#2d1537" stroke="#ec4899" stroke-width="2"/>
    <path d="M85 90 v-12 c0 -8 6 -14 15 -14 s15 6 15 14 v12" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="100" cy="115" r="8" fill="#f59e0b" />
  </g>

  <!-- Badge -->
  <rect x="50" y="65" width="185" height="28" rx="14" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <text x="65" y="84" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" letter-spacing="1">E-COMMERCE &amp; DATABASE</text>

  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="url(#csAccent)" letter-spacing="-0.5">Click &amp; Shop</text>

  <!-- Description snippet -->
  <text x="50" y="185" font-family="system-ui, sans-serif" font-size="16" fill="#cbd5e1" font-weight="400">Simulación completa de e-commerce</text>
  <text x="50" y="210" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">basada en arquitectura y lógica PL/SQL</text>

  <!-- Tags -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="14" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">PL/SQL</text>

    <rect x="95" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="108" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">Oracle DB</text>

    <rect x="190" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="202" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">E-Commerce</text>
  </g>
</svg>
